<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profile.css">
    <title>Profile Page</title>
</head>
<body>

     <div class="profile-container">

        <h1>แก้ไขโปรไฟล์</h1>

        <form id="profile-form">

            <label>Username</label>

            <input
                type="text"
                id="username"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="email"
                required
            >


            <label>ชื่อ</label>

            <input
                type="text"
                id="name"
                required
            >


            <label>เบอร์โทร</label>

            <input
                type="text"
                id="phone"
                required
            >


            <label>ที่อยู่</label>

            <textarea
                id="address"
                required
            ></textarea>


            <label>
                Password ใหม่
                <small>(เว้นว่างถ้าไม่ต้องการเปลี่ยน)</small>
            </label>

            <input
                type="password"
                id="password"
            >


            <button type="submit">
                บันทึกข้อมูล
            </button>

        </form>

        <a href="../main/main.html">
            กลับหน้าหลัก
        </a>

    </div>
    <script src="profile.js"></script>
</body>
</html>
